name: Release
on: push
permissions:
  contents: write
jobs:
  test_build_release:
    runs-on: ubuntu-latest
    # permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install uv
          # uv venv
          # source .venv/bin/activate
          # uv sync --all-groups
          uv sync --all-groups --no-group dev
      - name: Lint
        run: uv run ruff check
      - name: Type Check
        run: uv run ty check
      - name: Test
        run: uv run pytest
      - name: Build
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: uv build
      - name: Release
        # only for release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
          $(ls -d -1 "$PWD/dist/"*.*)#Wheel \
          --repo="$GITHUB_REPOSITORY" \
          --title="${tag#v}" \
          --generate-notes
